name: Autograding

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run public tests
        run: pytest tests_public -v
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run hidden tests
        run: pytest hidden_tests -v
      - name: Generate grade summary
        run: |
          echo "Public tests: PASS" > grading_summary.txt
          echo "Hidden tests: PASS" >> grading_summary.txt

      - name: Upload grading summary
        uses: actions/upload-artifact@v4
        with:
          name: grading-summary
          path: grading_summary.txt
